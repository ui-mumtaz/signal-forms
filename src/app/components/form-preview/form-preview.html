@if (rows().length) {
  <form (ngSubmit)="submit()" novalidate class="preview-form">
    @for (row of rows(); track row.id) {
      <div class="form-row">
        @for (field of row.fields; track field.id) {
          <app-field-renderer class="form-field" [field]="field" [control]="control(field.name)" />
        }
      </div>
    }
    <div class="actions">
      <button mat-stroked-button type="button" (click)="reset()">Reset</button>
      <button mat-flat-button type="submit">Submit</button>
    </div>
  </form>
} @else {
  <p class="empty">The form has no fields yet. Switch to Editor and drag some in.</p>
}

@if (submitted(); as value) {
  <mat-card appearance="outlined" class="result">
    <mat-card-header>
      <mat-icon matCardAvatar class="ok">check_circle</mat-icon>
      <mat-card-title>Submitted value</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <pre>{{ value | json }}</pre>
    </mat-card-content>
  </mat-card>
}
