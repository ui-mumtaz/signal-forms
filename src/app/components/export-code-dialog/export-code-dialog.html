<h2 mat-dialog-title>Export code</h2>
<mat-dialog-content>
  <p class="intro">A standalone Angular Material component using Signal Forms. Copy each file into your project.</p>
  <mat-tab-group [selectedIndex]="selected()" (selectedIndexChange)="selected.set($event)" animationDuration="0ms">
    @for (file of files; track file.fileName) {
      <mat-tab [label]="file.label">
        <div class="file-name">{{ file.fileName }}</div>
        <pre><code>{{ file.code }}</code></pre>
      </mat-tab>
    }
  </mat-tab-group>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="download()"><mat-icon>download</mat-icon>Download</button>
  <button mat-button (click)="copy()"><mat-icon>content_copy</mat-icon>Copy</button>
  <button mat-flat-button mat-dialog-close>Close</button>
</mat-dialog-actions>
